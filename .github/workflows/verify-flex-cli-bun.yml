name: Verify flex-cli Bun executable

on:
  pull_request:
    paths:
      - ".github/workflows/build-flex-cli.yml"
      - ".github/workflows/changesets.yml"
      - ".bun-version"
      - ".github/workflows/release-flex-cli.yml"
      - ".github/workflows/verify-flex-cli-bun.yml"
      - "apps/flex-cli/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/release-flex-cli*"
      - ".changeset/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-flex-cli.yml"
      - ".github/workflows/changesets.yml"
      - ".bun-version"
      - ".github/workflows/release-flex-cli.yml"
      - ".github/workflows/verify-flex-cli-bun.yml"
      - "apps/flex-cli/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/release-flex-cli*"
      - ".changeset/**"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-flex-cli.yml
    with:
      ref: ${{ github.sha }}
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: node --test scripts/release-flex-cli.test.mjs
