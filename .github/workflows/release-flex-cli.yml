name: Release flex-cli

on:
  push:
    tags:
      - "flex-cli@*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: flex-ax-linux-x64
            smoke: ./flex-ax-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: flex-ax-darwin-arm64
            smoke: ./flex-ax-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            outfile: flex-ax-windows-x64.exe
            smoke: ./flex-ax-windows-x64.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6.0.5
        with:
          version: 9.15.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: pnpm install --frozen-lockfile --filter ./apps/flex-cli...

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#flex-cli@}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        working-directory: apps/flex-cli
        shell: bash
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: Build executable
        run: |
          mkdir -p artifacts
          bun build --compile --target=${{ matrix.target }} ./apps/flex-cli/src/cli.ts --outfile ./artifacts/${{ matrix.outfile }}

      - name: Smoke test executable
        run: |
          ${{ matrix.smoke }} --version
          ${{ matrix.smoke }} status
        working-directory: artifacts

      - name: Smoke test import + query (regression for #41)
        shell: bash
        working-directory: artifacts
        run: |
          mkdir -p sample/instances sample/templates sample/attendance
          echo '{"startedAt":"2024-01-01T00:00:00Z","durationMs":0}' > sample/crawl-report.json
          OUTPUT_DIR=sample ${{ matrix.smoke }} import
          test -f sample/flex-ax.db
          OUTPUT_DIR=sample ${{ matrix.smoke }} query "SELECT count(*) AS n FROM templates"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.outfile }}
          path: artifacts/${{ matrix.outfile }}

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p dist
          find release-assets -type f -exec cp {} dist/ \;

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#flex-cli@}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: "flex-cli ${{ steps.version.outputs.version }}"
          files: dist/*
          generate_release_notes: true
