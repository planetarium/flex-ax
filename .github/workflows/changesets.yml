name: Version and release flex-cli

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flex-cli-version-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6.0.5
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Capture the main commit before Changesets checks out its release branch.
      - name: Detect approved version change
        id: release
        run: node scripts/release-flex-cli.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or update Release PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: "chore: release flex-cli"
          commit: "chore: release flex-cli"
          createGithubReleases: false
          github-token: ${{ github.token }}

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-flex-cli.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      tag: ${{ needs.version.outputs.tag }}
